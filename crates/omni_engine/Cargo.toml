[package]
name = "omni_engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
omni_verify = { path = "../omni_verify" }
omni_runtime = { path = "../omni_runtime" }
candle-core = { git = "https://github.com/PCfVW/candle", branch = "fix/cpuid-count-unsafe" }
candle-transformers = { git = "https://github.com/PCfVW/candle", branch = "fix/cpuid-count-unsafe" }
tokenizers = "0.23.2"
memmap2 = "0.9.12"

[build-dependencies]
cc = "1.0"

[features]
default = []
cuda = ["candle-core/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-transformers/metal"]
accelerate = ["candle-core/accelerate", "candle-transformers/accelerate"]
full-build = []
