[package]
name = "omni_cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "omnic"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
blake3.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
omni_preamble = { path = "../omni_preamble" }
omni_mem = { path = "../omni_mem" }
omni_parser = { path = "../omni_parser" }
omni_verify = { path = "../omni_verify" }
omni_codegen = { path = "../omni_codegen" }
omni_engine = { path = "../omni_engine" }
omni_runtime = { path = "../omni_runtime" }

[features]
default = []
cuda = ["omni_engine/cuda"]
metal = ["omni_engine/metal"]
accelerate = ["omni_engine/accelerate"]
full-build = ["omni_engine/full-build"]

