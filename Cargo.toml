[workspace]
resolver = "2"
members = [
    "crates/omni_preamble",
    "crates/omni_mem",
    "crates/omni_parser",
    "crates/omni_runtime",
    "crates/omni_verify",
    "crates/omni_codegen",
    "crates/omni_engine",
    "crates/omni_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OmniScript Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
regex = "1.10"
walkdir = "2.4"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
